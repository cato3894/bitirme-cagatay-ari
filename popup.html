<!DOCTYPE html>
<html>

<head>
  <title>Disposable Email</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1>Email Response Generator</h1>
  <label for="senderName">Sender Name:</label>
  <input type="text" id="senderName" placeholder="Enter sender name">
  <label for="receiverName">Receiver Name:</label>
  <input type="text" id="receiverName" placeholder="Enter receiver name">
  <label for="dateTime">Date and Time:</label>
  <input type="datetime-local" id="dateTime">
  <div class="actions">
    <button id="generateBtn">Generate Email</button>
    <button id="generatePosResBtn">Generate Positive Email</button>
    <button id="generateNegResBtn">Generate Negative Email</button>
  </div>
  <ul id="emailList"></ul>

  <script src="popup.js"></script>
</body>

</html>
